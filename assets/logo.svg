<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101c"/>
      <stop offset="50%" stop-color="#141c30"/>
      <stop offset="100%" stop-color="#1d2642"/>
    </linearGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8a2be2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Waveform & Chord Gradients -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- macOS App Squircle Base with Shadow -->
  <rect x="40" y="40" width="432" height="432" rx="98" fill="url(#bgGrad)" filter="url(#dropShadow)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Inner Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)" opacity="0.15" filter="url(#neonGlow)"/>

  <!-- Acoustic Vocal Cord Ribbon / Sine Wave -->
  <path d="M 120 256 C 160 170, 200 170, 240 256 C 280 342, 320 342, 360 256 C 375 220, 390 220, 400 256" 
        fill="none" 
        stroke="url(#waveGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Harmonized Second Frequency Wave (Transposition representation) -->
  <path d="M 120 256 C 160 320, 200 320, 240 256 C 280 190, 320 190, 360 256 C 375 280, 390 280, 400 256" 
        fill="none" 
        stroke="url(#waveGrad)" 
        stroke-width="6" 
        stroke-opacity="0.5"
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Vertical Sound Frequency Stems (Representing Running Chords & Bars) -->
  <line x1="160" y1="210" x2="160" y2="302" stroke="#00f0ff" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  <line x1="200" y1="180" x2="200" y2="332" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <line x1="240" y1="230" x2="240" y2="282" stroke="#818cf8" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <line x1="280" y1="160" x2="280" y2="352" stroke="#c084fc" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)"/>
  <line x1="320" y1="195" x2="320" y2="317" stroke="#e879f9" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <line x1="360" y1="235" x2="360" y2="277" stroke="#f472b6" stroke-width="6" stroke-linecap="round" opacity="0.75"/>

  <!-- Synchronized Note Node -->
  <circle cx="280" cy="150" r="10" fill="#00f0ff" filter="url(#neonGlow)"/>
  <circle cx="280" cy="150" r="5" fill="#ffffff"/>
</svg>
